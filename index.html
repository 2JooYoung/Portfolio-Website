<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Young — Portfolio</title>
  <meta name="description" content="Young's portfolio — selected projects and works." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="site-header">
    <a class="logo" href="#top">young<span class="logo-dot">.</span></a>
    <nav class="nav">
      <a href="#projects">projects</a>
      <a href="#about">about</a>
      <a href="mailto:ljyg209@gmail.com">contact</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="toggle-knob"></span>
      </button>
    </nav>
  </header>

  <main id="top">
    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-name">Joo Young<span class="accent">.</span></h1>
        <div class="hero-meta">
          <p class="hero-role">game &amp; web developer</p>
          <p class="hero-tagline">
            <!-- 나중에 한 줄 소개로 교체 -->
            I make games and small web things,<br />
            and put them where people can play.
          </p>
        </div>
      </div>
    </section>

    <!-- ===== Projects ===== -->
    <section id="projects" class="projects">
      <h2 class="section-title">projects</h2>
      <div id="project-list" class="project-list">
        <!-- js/main.js가 js/projects.js 데이터를 읽어 렌더링 -->
      </div>
    </section>

    <!-- ===== About ===== -->
    <section id="about" class="about">
      <h2 class="section-title">about</h2>
      <p class="about-text">
        <!-- 나중에 자기소개 내용으로 교체 -->
        짧은 자기소개가 들어갈 자리입니다. 어떤 일을 하는지, 무엇에 관심이
        있는지 2–3문장 정도가 적당해요.
      </p>
    </section>
  </main>

  <!-- ===== Footer — statement close ===== -->
  <footer class="site-footer">
    <p class="footer-statement">
      Say hello —
      <a href="mailto:ljyg209@gmail.com">ljyg209@gmail.com</a>
    </p>
    <div class="footer-base">
      <span>© <span id="year"></span> Young</span>
      <a href="https://github.com/" target="_blank" rel="noopener">github</a>
    </div>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
